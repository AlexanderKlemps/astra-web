[project]
name = "astra-web"
version = "0.2.0"
description = "REST API for ASTRA beam dynamics simulations"
requires-python = ">=3.14,<3.15"
# Exact runtime versions are pinned after resolving Python 3.14 compatibility.
dependencies = [
    "aenum==3.1.16",
    "fastapi==0.119.1",
    "h5py==3.15.1",
    "matplotlib==3.10.9",
    "numpy==2.3.5",
    "openpmd-beamphysics==0.9.13",
    "orjson==3.11.9",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pydantic==2.12.5",
    "python-dotenv==1.1.1",
    "scipy==1.16.3",
    "shortuuid==1.0.13",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
# The application runs directly from /app; it is not built as a wheel.
package = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
  "."
]
