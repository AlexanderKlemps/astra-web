upstream astraweb {
    zone astraweb 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8080 resolve;
}

server{
   listen 80;
   listen [::]:80;
   server_name localhost;

   include /etc/nginx/mime.types;

   location /astra/ {
      client_max_body_size 512M;
      proxy_pass http://astraweb/;
   }
}
